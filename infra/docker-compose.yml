# Local development stack.
#
#     make backend-up            Postgres only, which is all local development needs
#     make backend-up-service    also builds and runs the service in a container
#
# The service is not started by default. It runs natively via `make api-up`, which is
# faster to iterate on, and building its image requires fetching Go modules inside the
# container, where the host's GOPROXY settings do not apply. On a network that cannot reach
# proxy.golang.org that build fails and takes the database down with it, which is a poor
# trade for a container nobody needs locally.
#
# Postgres is pinned to the same major version as the managed instance in staging and
# production. A local database that differs by a major version is a source of bugs that
# only appear after deployment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aperture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-aperture}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aperture} -d ${POSTGRES_DB:-aperture}"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      # Verbose statement logging locally, where the volume is low and the value is high.
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_min_duration_statement=0

  aperture:
    # Opt-in. `docker compose up -d` starts Postgres alone; the profile is what pulls this
    # in, so a failing image build cannot block the database.
    profiles:
      - service
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: local
        # Passed through so the in-container fetch can use whatever the host uses. On a
        # network that blocks the module proxy, export these before building:
        #   GOPROXY=direct GOSUMDB=off make backend-up-service
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    environment:
      APERTURE_HTTP_ADDR: ":8080"
      APERTURE_LOG_LEVEL: ${APERTURE_LOG_LEVEL:-debug}
      APERTURE_ENVIRONMENT: local
      APERTURE_DATABASE_URL: >-
        postgres://${POSTGRES_USER:-aperture}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-aperture}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
