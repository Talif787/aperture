# XcodeGen specification.
#
# The .xcodeproj is generated from this file and is not committed. Two reasons, both
# practical rather than ideological.
#
# First, a project file is the single worst merge conflict in iOS development, and
# generating it removes the conflict class entirely.
#
# Second, and specific to this project's development setup: a text specification can be
# edited, reviewed, and committed from Cloud Shell, where Xcode does not exist. The
# generation step runs on macOS, either on a developer machine or on the macOS CI runner.

name: Aperture
options:
  bundleIdPrefix: com.aperture
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ApertureCore:
    path: Packages/ApertureCore
  AperturePlatform:
    path: Packages/AperturePlatform

targets:
  Aperture:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: ApertureCore
        product: ApertureDomain
      - package: ApertureCore
        product: ApertureSync
      - package: ApertureCore
        product: ApertureContracts
      - package: AperturePlatform
        product: ApertureData
      - package: AperturePlatform
        product: ApertureSecurity
      - package: AperturePlatform
        product: ApertureTelemetry
      - package: AperturePlatform
        product: ApertureDesignSystem
      - package: AperturePlatform
        product: FeatureInspection
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aperture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Build configuration surfaced to AppEnvironment. Resolved per configuration from
        # the xcconfig files above, so a build cannot silently point at the wrong backend.
        ApertureEnvironmentName: $(APERTURE_ENVIRONMENT_NAME)
        ApertureAPIBaseURL: $(APERTURE_API_BASE_URL)
        ApertureOAuthClientID: $(APERTURE_OAUTH_CLIENT_ID)
        ApertureDiagnosticsEnabled: $(APERTURE_DIAGNOSTICS_ENABLED)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Purpose strings are written now rather than at first use. A vague or missing one
        # is an App Review rejection, and writing them early forces the question of why
        # each permission is needed at all.
        NSCameraUsageDescription: >-
          Aperture uses the camera to capture photographic evidence during an inspection.
          Photos stay on this device unless your organization's policy requires upload.
        NSMicrophoneUsageDescription: >-
          Aperture records audio only while you are capturing a video note during an
          inspection.
        NSLocationWhenInUseUsageDescription: >-
          Aperture records the location of each capture so that findings can be tied to the
          site they document. Aperture never tracks your location in the background.
        NSPhotoLibraryUsageDescription: >-
          Aperture can attach an existing photo to an inspection when you choose one.
        NSFaceIDUsageDescription: >-
          Aperture uses Face ID to lock inspection records, which can contain photographs
          of customer property.
