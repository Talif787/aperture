version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam

  settings:
    gosec:
      excludes:
        # G104 is covered more precisely by errcheck in the standard set.
        - G104
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
        - name: context-as-argument
        - name: error-return
        - name: error-strings

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofmt
    - goimports
