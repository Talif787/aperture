version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam

  settings:
    gosec:
      excludes:
        # G104 is covered more precisely by errcheck in the standard set.
        - G104
    revive:
      rules:
        # No checkPrivateReceivers: Go convention does not require doc comments on
        # methods of unexported types, and requiring them produces noise on every
        # internal helper without improving the public API surface.
        - name: exported
        - name: context-as-argument
        - name: error-return
        - name: error-strings

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofmt
    - goimports
