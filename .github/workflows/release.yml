# Builds and publishes on a version tag.
#
# Separate from the pull request gate because the two answer different questions. The gate
# asks whether a change is safe to merge; this asks whether a commit is fit to ship, which
# includes reproducibility and a manifest of what went into the binary.
#
# It re-runs the full gate rather than trusting that it passed on the pull request. A tag
# can point at any commit, including one that was never gated, and discovering that after
# publishing is the wrong order.
name: release

on:
  push:
    tags:
      - 'phase-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aperture
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: aperture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aperture -d aperture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed for `git describe`, and a shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Static checks
        run: make check

      - name: Formatting
        run: make backend-fmt-check

      - name: Vet
        run: make backend-vet

      - name: Tests
        env:
          APERTURE_TEST_DATABASE_URL: postgres://aperture:local-development-only@localhost:5432/aperture?sslmode=disable
        run: make backend-test

      - name: Fuzz seed corpus
        working-directory: backend
        run: go test -run '^Fuzz' ./...

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Report the version this will embed
        run: make version

      # Twice, compared. A build that is not reproducible cannot be audited: nobody can
      # confirm that the published binary came from the published source.
      - name: Reproducible build
        run: make build-verify

      - name: Module manifest
        run: make sbom

      # The binary is asked directly rather than inferred from the build command. A tag
      # whose artifact reports a different version than the tag is a problem worth finding
      # before the artifact is published, not after someone correlates a log line with it.
      - name: Confirm the version reached the binary
        run: |
          embedded=$(./dist/aperture -version)
          expected=$(make version)
          echo "binary reports ${embedded}, expected ${expected}"
          [ "${embedded}" = "${expected}" ] || {
            echo "the embedded version does not match the build"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: aperture-${{ github.ref_name }}
          path: |
            dist/aperture
            dist/aperture.sha256
            dist/aperture.modules.txt
          if-no-files-found: error

      # Attached to the tag so the checksum and manifest travel with it. Without them the
      # artifact is a binary nobody can verify against anything.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aperture
            dist/aperture.sha256
            dist/aperture.modules.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
